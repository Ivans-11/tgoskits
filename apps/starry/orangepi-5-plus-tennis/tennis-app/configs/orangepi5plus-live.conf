# Orange Pi 5 Plus complete tennis-ball pickup flow.
# Command-line options override values from this file.
mode=live
model=/home/orangepi/tennis-app-live/model/tennis.rknn
label=/home/orangepi/tennis-app-live/model/labels.txt

device=0
width=640
height=480
fps=30
duration-sec=3600

motor-backend=uart
motor-device=/dev/ttyS6
motor-min-speed=28
arm-backend=uart
arm-device=/dev/ttyS3
grab-motion-ms=450
arm-ready-servo1=118

# Ball pursuit uses proportional steering above the physical speed floor.
area-far=0.13
area-stop=0.53
area-reverse=0.57
stop-center-offset=108
stop-center-zone=20
stop-confirm-cnt=3
chase-far-speed=70
chase-forward-speed=30
chase-turn-k=24
chase-max-bias=24
chase-close-pivot-speed=30
reverse-speed=28
deposit-reverse-speed=55
deposit-reverse-ms=800
search-pivot-speed=40
search-reverse-turns=2

# Red-bucket acquisition and approach thresholds.
bucket-min-area=4000
bucket-area-brake=0.50
bucket-area-deposit=0.82
bucket-k-turn=24
bucket-max-bias=12
bucket-approach-speed=60
bucket-brake-speed=35
bucket-search-speed=40

# Disable odometry guidance while tuning the Linux board runtime.
odometry-enabled=false
odometry-wheel-radius-m=0.03
odometry-wheel-base-m=0.18
odometry-sample-ms=100
odometry-stale-ms=500
odometry-max-gap-ms=500
odometry-max-rpm=300
return-heading-tolerance-deg=15
return-stop-radius=0.50
return-max-distance=10
return-timeout-ms=15000
return-pivot-speed=30
return-forward-speed=30

ball-class=0
min-confidence=70
core-mask=all
infer-affinity=4
camera-warmup-frames=3
camera-warmup-timeout-ms=3000
camera-watchdog-ms=2000
staleness-ms=0
log-every=300
profile=false
