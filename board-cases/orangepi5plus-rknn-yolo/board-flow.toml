[case]
name = "orangepi5plus-rknn-yolo"
app_dir = "../../apps/starry/orangepi-5-plus-uvc-rknn"

[assets]
build = ["./build-image-runner.sh yolo"]

[[assets.items]]
source = "rknn-yolov8-image/install/rk3588_linux_aarch64/rknn_yolov8_image"
target = "/rknn_yolov8_image"

[linux]
command = '''
cd /rknn_yolov8_image &&
export LD_LIBRARY_PATH=/rknn_yolov8_image/lib:/usr/local/lib:/usr/lib/aarch64-linux-gnu:$LD_LIBRARY_PATH &&
printf "%s\n" "${BOARD_PASSWORD:?BOARD_PASSWORD is required for sudo}" | sudo -E -S \
  ./rknn_yolov8_image validation/tennis-ball-close.jpg &&
sudo -E ./rknn_yolov8_image validation/tennis-ball-black-box.jpg &&
sudo -E ./rknn_yolov8_image validation/tennis-ball-plant.jpg &&
echo YOLO_IMAGE_DONE
'''
success_regex = [
  "(?m)^YOLO_IMAGE_DONE$",
]
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "(?m)^rknn_init fail!.*$",
  "(?m)^read_image fail!.*$",
  "(?m)^inference_yolov8_model fail!.*$",
  "(?i)error while loading shared libraries",
  "(?i)(rknn_yolov8_image|sh): .*not found",
]
timeout = 120

[starry]
board_config = "board-orangepi-5-plus-yolo.toml"
