args = [
  "-nodefaults",
  "-no-user-config",
  "-display",
  "none",
  "-serial",
  "stdio",
  "-monitor",
  "none",
  "-cpu",
  "host",
  "-machine",
  "q35,sata=off,smbus=off,i8042=off,usb=off,graphics=off",
  "-smp",
  "4",
  "-accel",
  "kvm",
  "-m",
  "512M",
]
timeout = 120
fail_regex = [
  "(?i)\\bpanic(?:ked)?\\b",
  "CONFORMANCE .*status=FAIL",
  "CONFORMANCE summary=FAIL",
]
success_regex = ["CONFORMANCE summary=PASS complete=true"]
to_bin = false
uefi = false
